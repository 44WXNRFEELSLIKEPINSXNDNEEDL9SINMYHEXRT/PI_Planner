global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pi-planner
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: pi-planner
