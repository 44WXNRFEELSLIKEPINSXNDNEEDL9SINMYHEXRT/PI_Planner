
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    cpus: ${DB_CPU_LIMIT:-1.0}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    pids_limit: ${DB_PIDS_LIMIT:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Эти SQL-файлы выполняются только при создании пустого postgres_data.
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_contract.sql:/docker-entrypoint-initdb.d/02_contract.sql:ro
      - ./build/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./db/03_substitutions.sql:/docker-entrypoint-initdb.d/04_substitutions.sql:ro
      - ./db/04_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./db/05_invariants.sql:/docker-entrypoint-initdb.d/06_invariants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT to_regclass('public.load_batches') IS NOT NULL
          AND to_regclass('public.v_plan_violations') IS NOT NULL" | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    cpus: ${APP_CPU_LIMIT:-0.5}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-100}
    environment:
      APP_PORT: 8000
      PI_PLANNER_LOG_FORMAT: ${PI_PLANNER_LOG_FORMAT:-json}
      PI_PLANNER_METRICS_TTL: ${PI_PLANNER_METRICS_TTL:-15}
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      bootstrap-plan:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend
      - monitoring

  # seed.sql содержит исходный датасет, но не результат планировщика. Без этого
  # одноразового шага свежий контейнер показывает задачи и пустой экран KPI.
  bootstrap-plan:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tools/run_planner.py", "--if-empty"]
    restart: "no"
    init: true
    cpus: ${APP_CPU_LIMIT:-0.5}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-100}
    environment:
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  # Запускается перед каждым релизом: docker compose run --rm migrate.
  # Не добавлен в обычный `up`, чтобы локальный demo-старт не требовал
  # отдельного lifecycle-контейнера.
  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tools/migrate.py"]
    restart: "no"
    init: true
    stop_grace_period: 10s
    cpus: ${APP_CPU_LIMIT:-0.5}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-100}
    environment:
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  backup:
    image: postgres:17-bookworm
    # Bind-mount должен быть доступен тому же uid/gid, что владеет BACKUP_DIR
    # на хосте. Иначе root без capabilities не может писать даже в 0755.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: ${BACKUP_CPU_LIMIT:-0.5}
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    pids_limit: ${BACKUP_PIDS_LIMIT:-100}
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-pi_planner}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_VERIFY_RESTORE: ${BACKUP_VERIFY_RESTORE:-true}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup.sh:/usr/local/bin/backup:ro
    command:
      - /bin/bash
      - -c
      - >-
        trap 'exit 0' TERM INT;
        while true; do /bin/bash /usr/local/bin/backup || exit $$?;
        sleep "$${BACKUP_INTERVAL_SECONDS}"; done
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    pids_limit: ${CADDY_PIDS_LIMIT:-100}
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
      - observability_proxy

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.5}
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-512m}
    pids_limit: ${PROMETHEUS_PIDS_LIMIT:-100}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.enable-lifecycle
    expose:
      - "9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: ${GRAFANA_CPU_LIMIT:-1.0}
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    pids_limit: ${GRAFANA_PIDS_LIMIT:-200}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-exposing}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.localhost}
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - monitoring
      - observability_proxy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  frontend:
  backend:
    internal: true
  monitoring:
    internal: true
  observability_proxy:
    internal: true
