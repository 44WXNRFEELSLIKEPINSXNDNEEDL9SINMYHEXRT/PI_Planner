
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    cpus: ${DB_CPU_LIMIT:-1.0}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    pids_limit: ${DB_PIDS_LIMIT:-200}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Эти SQL-файлы выполняются только при создании пустого postgres_data.
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_contract.sql:/docker-entrypoint-initdb.d/02_contract.sql:ro
      - ./build/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./db/03_substitutions.sql:/docker-entrypoint-initdb.d/04_substitutions.sql:ro
      - ./db/04_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./db/05_invariants.sql:/docker-entrypoint-initdb.d/06_invariants.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT to_regclass('public.load_batches') IS NOT NULL
          AND to_regclass('public.v_plan_violations') IS NOT NULL" | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    cpus: ${APP_CPU_LIMIT:-0.5}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-100}
    environment:
      APP_PORT: 8000
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # Запускается перед каждым релизом: docker compose run --rm migrate.
  # Не добавлен в обычный `up`, чтобы локальный demo-старт не требовал
  # отдельного lifecycle-контейнера.
  migrate:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "tools/migrate.py"]
    restart: "no"
    init: true
    stop_grace_period: 10s
    cpus: ${APP_CPU_LIMIT:-0.5}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-100}
    environment:
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    cpus: ${BACKUP_CPU_LIMIT:-0.5}
    mem_limit: ${BACKUP_MEMORY_LIMIT:-256m}
    pids_limit: ${BACKUP_PIDS_LIMIT:-100}
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-pi_planner}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_VERIFY_RESTORE: ${BACKUP_VERIFY_RESTORE:-true}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup.sh:/usr/local/bin/backup:ro
    command:
      - /bin/bash
      - -c
      - >-
        trap 'exit 0' TERM INT;
        while true; do /bin/bash /usr/local/bin/backup || exit $$?;
        sleep "$${BACKUP_INTERVAL_SECONDS}"; done
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    pids_limit: ${CADDY_PIDS_LIMIT:-100}
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
