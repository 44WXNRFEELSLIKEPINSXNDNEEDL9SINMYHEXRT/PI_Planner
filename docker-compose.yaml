
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pi_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_contract.sql:/docker-entrypoint-initdb.d/02_contract.sql:ro
      - ./build/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
      - ./db/03_substitutions.sql:/docker-entrypoint-initdb.d/04_substitutions.sql:ro
      - ./db/04_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./db/05_invariants.sql:/docker-entrypoint-initdb.d/06_invariants.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      PI_PLANNER_DSN: >-
        host=db port=5432 dbname=${POSTGRES_DB:-pi_planner}
        user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres}
    expose:
      - "8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    networks:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
