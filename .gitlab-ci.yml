# CI PI-Planner: unit, pg, cycle, schema-equivalence, web.
#
# Джобы со статусом «пока не блокирует» помечены `allow_failure: true` и
# комментарием, КОГДА это снимается (волна плана). Снимать флаг — отдельным
# коммитом в той же волне, не откладывая.

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Сервис PostgreSQL: тот же мажор, что в docker-compose.yaml.
  POSTGRES_DB: pi_planner
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  # Коммит, от которого считаются «старые» базы при проверке миграций:
  # вершина develop на момент приёма аудита (d5cde74).
  MIGRATION_BASE_REF: d5cde74

cache:
  key: "py-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv
    - .cache/pip

.python:
  image: python:3.14-slim
  before_script:
    - pip install --quiet "uv>=0.12"
    - uv sync --frozen --group dev

.postgres:
  services:
    - name: pgvector/pgvector:0.8.6-pg17-bookworm
      alias: postgres
  variables:
    PI_PLANNER_DSN: "host=postgres port=5432 dbname=pi_planner user=postgres password=postgres"
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pi_planner"

# --- Юнит-тесты (без базы): PostgreSQL-тесты здесь пропускаются ------------
unit:
  extends: .python
  stage: test
  script:
    - uv run pytest -q -rs --junitxml=junit-unit.xml
  artifacts:
    when: always
    reports:
      junit: junit-unit.xml
    paths: [junit-unit.xml]
    expire_in: 1 week

# --- Те же тесты с PostgreSQL: ни один тест не должен быть пропущен --------
pg:
  extends: [.python, .postgres]
  stage: test
  script:
    - uv run python tools/apply_sql.py --wait 60
    - |
      rc=0
      uv run pytest -q -rs -p no:cacheprovider --junitxml=junit-pg.xml > pytest.log 2>&1 || rc=$?
      cat pytest.log
      if grep -q "нужен PostgreSQL" pytest.log; then
        echo "ОШИБКА: PostgreSQL-тесты пропущены, TEST_DATABASE_URL не сработал" >&2
        exit 1
      fi
      exit $rc
  artifacts:
    when: always
    paths: [pytest.log, junit-pg.xml]
    reports:
      junit: junit-pg.xml
    expire_in: 1 week

# --- Цикл: датасет -> базовый план -> факт спринтов 1–3, 0 ошибок приёмки --
cycle:
  extends: [.python, .postgres]
  stage: test
  script:
    - uv run python tools/apply_sql.py --wait 60
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
      db/06_migration_stamps.sql
    - uv run python tools/ci_cycle_check.py --sprints 3

# --- Числа README (§8, §9) совпадают с базовым планом на выданном датасете --
readme-numbers:
  extends: [.python, .postgres]
  stage: test
  script:
    - uv run python tools/apply_sql.py --wait 60
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
      db/06_migration_stamps.sql
    - uv run python tools/run_planner.py
    - uv run python tools/readme_numbers.py --check

# --- Чистая установка и обновление дают одну и ту же схему -----------------
# Чистая установка (db/01…06 + seed) и `migrate` — no-op; старая база
# (MIGRATION_BASE_REF) + `migrate` — та же схема (B-1, B-7).
schema-equivalence:
  extends: [.python, .postgres]
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - uv run python tools/apply_sql.py --wait 60
    - |
      uv run python - <<'PY'
      import os, psycopg
      with psycopg.connect(os.environ["PI_PLANNER_DSN"], autocommit=True) as c:
          for name in ("fresh", "upgraded"):
              c.execute(f"DROP DATABASE IF EXISTS {name}")
              c.execute(f"CREATE DATABASE {name}")
      PY
    - export BASE="host=postgres port=5432 user=postgres password=postgres"
    # python:3.14-slim не содержит git; он нужен для git archive ниже.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
    # 1. Чистая установка из текущего дерева, затем migrate — обязан быть no-op.
    - export PI_PLANNER_DSN="$BASE dbname=fresh"
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
      db/06_migration_stamps.sql
    - uv run python tools/migrate.py
    - uv run python tools/schema_fingerprint.py > fresh.txt
    # 2. Старая база: базовые файлы MIGRATION_BASE_REF, затем все миграции.
    - mkdir -p /tmp/base && git archive "$MIGRATION_BASE_REF" db build | tar -x -C /tmp/base
    - export PI_PLANNER_DSN="$BASE dbname=upgraded"
    - >
      uv run python tools/apply_sql.py
      /tmp/base/db/01_schema.sql /tmp/base/db/02_contract.sql /tmp/base/build/seed.sql
      /tmp/base/db/03_substitutions.sql /tmp/base/db/04_views.sql /tmp/base/db/05_invariants.sql
    - uv run python tools/migrate.py
    - uv run python tools/schema_fingerprint.py > upgraded.txt
    - diff -u fresh.txt upgraded.txt
  artifacts:
    when: always
    paths: [fresh.txt, upgraded.txt]
    expire_in: 1 week

# --- Фронт: сборка и свежесть закоммиченного web/dist ----------------------
web:
  image: node:22-bookworm-slim
  stage: test
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - cd web
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - cd ..
    - |
      if ! git diff --exit-code -- web/dist; then
        echo "web/dist устарел: выполните npm run build и закоммитьте" >&2
        exit 1
      fi
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths: [web/node_modules/.cache]

# --- Браузерная проверка входа и ролей (tests/e2e) ---------------------------
# Сначала НЕ блокирует: сценарий проверен локально (chromium 1243), но в этом образе
# на GitLab ещё не запускался. Снять allow_failure после первого зелёного пайплайна.
e2e-ui:
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: test
  allow_failure: true
  services:
    - name: pgvector/pgvector:0.8.6-pg17-bookworm
      alias: postgres
  variables:
    PI_PLANNER_DSN: "host=postgres port=5432 dbname=pi_planner user=postgres password=postgres"
    POSTGRES_DB: pi_planner
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    UV_LINK_MODE: copy
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --frozen --no-dev
    - mkdir -p /tmp/e2e && cd /tmp/e2e && npm init -y >/dev/null && npm i playwright-core@1.63.0 --no-audit --no-fund && cd "$CI_PROJECT_DIR"
  script:
    - export PATH="$HOME/.local/bin:$PATH" NODE_PATH=/tmp/e2e/node_modules
    - OUT="$CI_PROJECT_DIR/e2e-out" mkdir -p e2e-out && OUT="$CI_PROJECT_DIR/e2e-out" tests/e2e/run_auth_ui.sh
  artifacts:
    when: always
    paths: [e2e-out]
    expire_in: 1 week

# --- Стиль: ruff (правила E, F — pyproject.toml) -----------------------------
lint:
  image: python:3.14-slim
  stage: test
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check --output-format=concise app etl tools tests
