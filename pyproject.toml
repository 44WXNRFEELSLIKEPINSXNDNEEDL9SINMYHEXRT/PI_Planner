[project]
name = "pi-planner"
version = "0.1.0"
description = "Планировщик квартала и звёздная карта команд: API и UI поверх слоя данных ПочтаТеха"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "ortools>=9.15,<10",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
required-version = ">=0.12"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Минимальный набор: ошибки и неиспользуемое. Расширять отдельным MR.
select = ["E", "F"]
